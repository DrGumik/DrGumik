name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      # Telemetry, languages and activity cards in the Coldbit pixel style.
      # Optional: add a classic PAT (read:user) as secret PROFILE_TOKEN to count private contributions too.
      - name: Generate stat cards
        run: python scripts/stats.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      # Contribution snake in the Coldbit ice ramp (dark-only, like the brand).
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#eafffe&color_dots=#0d1420,#2f7099,#5cc3ec,#7fd4f5,#bfe9ff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
